id: PC6
metadata:
  topic: Genetics and Inheritance
  marks: 3
  difficulty_level: 0.6
question:
  text: In a clinical study of $1200$ patients with a rare genetic disorder, it is
    found that $42\%$ of the patients exhibit a specific symptom. Calculate the number
    of patients who exhibit this symptom. Express your final answer to the nearest whole number.
  variables:
  - total_population: 1200
  - mutation_percentage: 42
solution:
  final_answer: 504
  marks_available: 3
  steps:
  - step_number: 1
    text: 'Convert the percentage to a decimal: $\frac{42}{100} = 0.42$'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 0.42
    tolerance: 0.001
  - step_number: 2
    text: 'Multiply the decimal by the total number of patients: $0.42 \times 1200$'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 504
    tolerance: 0.1
  - step_number: 3
    text: 'State the final answer with the correct unit: $504 \text{ patients}$'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 504
    tolerance: 0.1
