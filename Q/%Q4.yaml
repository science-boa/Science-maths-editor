question:
  text: An electric motor has a total energy input of $8.20 \times 10^4 \text{ J}$.
    The motor is $35\%$ efficient at transferring this energy into kinetic energy.
    Calculate the energy transferred as kinetic energy in $\text{kJ}$.
  variables:
  - total_energy: 82000
  - efficiency: 0.35
solution:
  final_answer: 28.7
  marks_available: 3
  steps:
