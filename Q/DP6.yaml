question:
  text: A calculated value from an experiment is $0.17648$ units. Round this value
    to 3 decimal places.
  variables: []
solution:
  final_answer: 0.176
  marks_available: 1
  steps:
  - step_number: 1
    text: To round $0.17648$ to 3 decimal places, identify the third decimal place
      digit, which is $6$. Then, look at the fourth decimal place digit, which is
      $4$. Since $4$ is less than $5$, the third decimal place digit remains unchanged.
      Thus, $0.17648$ rounded to 3 decimal places is $0.176$.
    marks_assigned: 1
