<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maths for Science v0.34</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 antialiased font-sans">

  <div class="max-w-7xl mx-auto px-4 py-8">
    <header class="mb-8 border-b border-gray-200 pb-4">
      <div class="flex justify-between items-center mb-2">
        <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Maths for Science</h1>
        <span id="loading-badge" class="bg-amber-100 text-amber-800 text-xs font-semibold px-3 py-1 rounded-full animate-pulse">Loading Questions...</span>
      </div>
      <button onclick="document.getElementById('equation-modal').classList.remove('hidden')" class="text-sm font-medium text-blue-600 hover:text-blue-800 underline underline-offset-4 cursor-pointer">
        Science Equation Sheet
      </button>
    </header>

    <div id="dashboard" class="flex gap-2 mb-6 overflow-x-auto pb-2"></div>

    <div id="quiz-workspace" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-2 space-y-6">
        
        <div class="bg-white p-6 rounded-xl shadow-xs border border-gray-200 space-y-6">
          
          <div id="question-area">
            <div class="text-gray-400 text-center py-16">Awaiting parameters or demo preset...</div>
          </div>

          <div id="working-area" class="pt-4 border-t border-gray-100 hidden">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Working</h3>
            <textarea id="scratchpad" oninput="saveScratchpad()" placeholder="Type your equations, formulas, and numeric calculations here..." class="w-full h-44 p-3 font-mono text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none bg-amber-50/30"></textarea>
          </div>

          <div id="answer-area" class="pt-4 border-t border-gray-100 hidden">
            <div class="flex items-center gap-4">
              <label class="font-semibold text-gray-700 shrink-0">Your Answer:</label>
              <input type="number" id="answer-input" step="any" oninput="captureAnswer(this.value)" placeholder="Enter numeric value" class="border border-gray-300 rounded-lg px-3 py-2 w-48 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none font-mono">
            </div>
          </div>

        </div>

        <div class="flex flex-wrap justify-between items-center pt-2 gap-2">
          <button id="btn-prev" onclick="changeQuestion(-1)" class="px-5 py-2 bg-gray-200 hover:bg-gray-300 disabled:opacity-40 font-medium rounded-lg transition-colors cursor-pointer" disabled>
            ← Previous
          </button>
          
          <div class="flex items-center gap-2">
            <button id="btn-video" onclick="openVideoModal()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-medium rounded-lg transition-colors cursor-pointer hidden">
              🎬 Video Clip
            </button>
            <button id="btn-next" onclick="handleNextButton()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors cursor-pointer">
              Next →
            </button>
            <button id="btn-submit" onclick="submitQuiz()" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition-colors hidden cursor-pointer">
              Submit Quiz
            </button>
          </div>
        </div>
      </div>

      <div class="space-y-6">
        <div class="bg-slate-900 text-white p-4 rounded-2xl shadow-xl border border-slate-800 w-full max-w-sm mx-auto">
          <div class="flex justify-between items-center mb-1 text-[10px] uppercase font-bold tracking-wider text-slate-400 px-1">
            <span>GCSE Scientific</span>
            <span class="text-emerald-400 font-mono">DEG MODE</span>
          </div>
          
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 mb-4 text-right font-mono min-h-[72px] flex flex-col justify-between">
            <div id="calc-history" class="text-xs text-slate-500 overflow-hidden text-ellipsis whitespace-nowrap"></div>
            <div id="calc-display" class="text-xl text-emerald-400 font-semibold overflow-x-auto whitespace-nowrap">0</div>
          </div>
          
          <div class="grid grid-cols-5 gap-1.5 text-xs font-bold">
            <button onclick="pressCalc('sin(')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg text-slate-300 cursor-pointer">sin</button>
            <button onclick="pressCalc('cos(')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg text-slate-300 cursor-pointer">cos</button>
            <button onclick="pressCalc('tan(')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg text-slate-300 cursor-pointer">tan</button>
            <button onclick="pressCalc('(')" class="bg-slate-700 hover:bg-slate-600 p-2.5 rounded-lg text-slate-200 cursor-pointer">(</button>
            <button onclick="pressCalc(')')" class="bg-slate-700 hover:bg-slate-600 p-2.5 rounded-lg text-slate-200 cursor-pointer">)</button>

            <button onclick="pressCalc('sqrt(')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg text-slate-300 cursor-pointer">√</button>
            <button onclick="pressCalc('^2')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg text-slate-300 cursor-pointer">x²</button>
            <button onclick="pressCalc('^')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg text-slate-300 cursor-pointer">xʸ</button>
            <button onclick="pressCalc('pi')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg text-slate-300 cursor-pointer">π</button>
            <button onclick="pressCalc('*10^')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg text-slate-300 cursor-pointer">EXP</button>

            <button onclick="pressCalc('7')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-lg cursor-pointer">7</button>
            <button onclick="pressCalc('8')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-lg cursor-pointer">8</button>
            <button onclick="pressCalc('9')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-lg cursor-pointer">9</button>
            <button onclick="pressCalc('DEL')" class="bg-amber-600 hover:bg-amber-500 p-3 rounded-lg text-white font-extrabold cursor-pointer">DEL</button>
            <button onclick="pressCalc('AC')" class="bg-rose-700 hover:bg-rose-600 p-3 rounded-lg text-white font-extrabold cursor-pointer">AC</button>

            <button onclick="pressCalc('4')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-lg cursor-pointer">4</button>
            <button onclick="pressCalc('5')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-lg cursor-pointer">5</button>
            <button onclick="pressCalc('6')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-lg cursor-pointer">6</button>
            <button onclick="pressCalc('*')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg text-base text-slate-300 cursor-pointer">×</button>
            <button onclick="pressCalc('/')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg text-base text-slate-300 cursor-pointer">÷</button>

            <button onclick="pressCalc('1')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-lg cursor-pointer">1</button>
            <button onclick="pressCalc('2')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-lg cursor-pointer">2</button>
            <button onclick="pressCalc('3')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-lg cursor-pointer">3</button>
            <button onclick="pressCalc('+')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg text-base text-slate-300 cursor-pointer">+</button>
            <button onclick="pressCalc('-')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg text-base text-slate-300 cursor-pointer">-</button>

            <button onclick="pressCalc('0')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-lg cursor-pointer">0</button>
            <button onclick="pressCalc('.')" class="bg-slate-700 hover:bg-slate-600 p-3 rounded-lg text-lg cursor-pointer">.</button>
            <button onclick="pressCalc('Ans')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg text-slate-300 cursor-pointer">Ans</button>
            <button onclick="pressCalc('=')" class="bg-emerald-600 hover:bg-emerald-500 p-3 rounded-lg text-white font-bold col-span-2 text-base shadow-lg cursor-pointer">=</button>
          </div>
        </div>
      </div>
    </div>

    <div id="quiz-results-screen" class="hidden max-w-4xl mx-auto space-y-8 pb-12">
      <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-8 rounded-2xl shadow-md text-center">
        <h2 class="text-3xl font-extrabold tracking-tight">Quiz Assessment Completed</h2>
        <p class="text-emerald-100 mt-2 text-lg font-medium">Review your step-by-step breakdown marks below</p>
        <div class="mt-4 inline-block bg-white/20 backdrop-blur-md px-6 py-2 rounded-full font-mono text-2xl font-bold">
          Total Score: <span id="results-score-badge">0 / 0</span>
        </div>
      </div>
      
      <div id="results-cards-container" class="space-y-6"></div>
    </div>
  </div>

  <div id="equation-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden">
      <div class="flex justify-between items-center p-4 border-b border-gray-100 bg-gray-50">
        <h3 class="font-bold text-lg text-gray-900">Science Equation Sheet</h3>
        <button onclick="document.getElementById('equation-modal').classList.add('hidden')" class="p-2 hover:bg-gray-200 rounded-full cursor-pointer transition-colors">
          <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <iframe src="https://www.aqa.org.uk/files/resources.science.AQA-8464-8465-FS-INS-2025_PDF/c4fac749855e8fefcd6ff58bd7b9cb701309df9b.pdf" class="flex-1 w-full border-none"></iframe>
    </div>
  </div>

  <div id="video-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col overflow-hidden">
      <div class="flex justify-between items-center p-4 border-b border-gray-100 bg-gray-50">
        <h3 class="font-bold text-lg text-gray-900">Video Explainer</h3>
        <button onclick="closeVideoModal()" class="p-2 hover:bg-gray-200 rounded-full cursor-pointer transition-colors">
          <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="p-6">
        <div id="video-container" class="w-full aspect-video bg-black rounded-xl overflow-hidden flex items-center justify-center">
          <!-- Dynamically inserted HTML5 video player -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const BASE_RAW_URL = "https://raw.githubusercontent.com/science-boa/Science-maths-editor/main/";
    const POWER_AUTOMATE_URL = "https://default4a7dcc91048348f19bae8f17879c3c.f9.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/29/workflows/a8a331e382e74657a516764c89be0275/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=KT9XgfUvTIbCqYn0cansRO7s6v85jfR9b5PieqcGt7c";

    let questions = [];
    let currentIndex = 0;
    let studentAnswers = {};
    let userID = null;
    let startTime = null;
    let checkModeEnabled = false;
    let perQuestionEvaluations = {};
    
    let calcExpression = "";
    let lastAnswer = 0;
    let finalResultsSummary = null;

    window.addEventListener('DOMContentLoaded', async () => {
      startTime = Date.now();
      const params = new URLSearchParams(window.location.search);
      userID = params.get('user') || params.get('User'); 
      
      const cParam = params.get('c');
      if (cParam !== null && cParam !== undefined && cParam.trim() !== '') {
        const valLower = cParam.trim().toLowerCase();
        if (valLower !== 'false' && valLower !== '0' && valLower !== 'no') {
          checkModeEnabled = true;
        }
      }
      
      const qKeys = [];
      
      for (let i = 1; i <= 10; i++) {
        const val = params.get(`q${i}`) || params.get(`Q${i}`);
        if (val) {
          qKeys.push({ key: `q${i}`, value: val });
        }
      }

      for (const [key, val] of params.entries()) {
        const lowerKey = key.toLowerCase();
        if ((lowerKey.startsWith('g') || lowerKey.startsWith('q')) && !qKeys.some(item => item.key.toLowerCase() === lowerKey)) {
          if (val) {
            qKeys.push({ key: key, value: val });
          }
        }
      }

      if (qKeys.length === 0) {
        questions.push({
          id: "demo-question",
          metadata: { topic: "Physics Mechanics Demo" },
          question: { text: "Calculate the kinetic energy of a car with mass $m = 1200\\text{ kg}$ travelling at a velocity of $v = 25\\text{ m/s}$. Use formula $E_k = \\frac{1}{2}mv^2$." },
          media: {
            video_explainer_url: "M1.mp4"
          },
          solution: {
            final_answer: "375000",
            steps: [
              { step_number: 1, text: "State formula $E_k = \\frac{1}{2}mv^2$", marks_assigned: 1, check_type: "numeric", milestone_value: 375000 }
            ]
          }
        });
        document.getElementById('loading-badge').classList.add('hidden');
        buildDashboard();
        renderCurrentQuestion();
        return;
      }

      for (const item of qKeys) {
        let fileId = item.value.trim();
        if (fileId.endsWith('.yaml') || fileId.endsWith('.yml')) {
          fileId = fileId.replace(/\.(yaml|yml)$/i, '');
        }

        let fetchedSuccessfully = false;
        const candidatePaths = [
          `${BASE_RAW_URL}Q/${fileId}.yaml`,
          `${BASE_RAW_URL}${fileId}.yaml`,
          `${BASE_RAW_URL}Q/g1/${fileId}.yaml`
        ];

        for (const url of candidatePaths) {
          try {
            const response = await fetch(url);
            if (response.ok) {
              const text = await response.text();
              const parsed = jsyaml.load(text);
              questions.push({ ...parsed, id: fileId });
              fetchedSuccessfully = true;
              break;
            }
          } catch (e) {
            // Try next candidate
          }
        }

        if (!fetchedSuccessfully) {
          questions.push({ id: fileId, error: true, message: `Failed fetching YAML configuration for identifier: ${fileId}` });
        }
      }

      document.getElementById('loading-badge').classList.add('hidden');
      buildDashboard();
      renderCurrentQuestion();
    });

    function buildDashboard() {
      const container = document.getElementById('dashboard');
      container.innerHTML = '';
      questions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.innerText = `Q${idx + 1}`;
        btn.className = `px-4 py-2 text-sm font-semibold rounded-lg border transition-all cursor-pointer ${idx === currentIndex ? 'bg-blue-600 border-blue-600 text-white shadow-xs' : 'bg-white border-gray-200 hover:bg-gray-50 text-gray-700'}`;
        btn.onclick = () => { currentIndex = idx; renderCurrentQuestion(); };
        container.appendChild(btn);
      });
    }

    function renderCurrentQuestion() {
      buildDashboard();
      const questionArea = document.getElementById('question-area');
      const workingArea = document.getElementById('working-area');
      const answerArea = document.getElementById('answer-area');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnSubmit = document.getElementById('btn-submit');
      const btnVideo = document.getElementById('btn-video');

      const q = questions[currentIndex];
      if (!q) return;
      if (q.error) {
        questionArea.innerHTML = `<div class="text-red-500 font-medium">⚠️ ${q.message} (${q.id})</div>`;
        workingArea.classList.add('hidden');
        answerArea.classList.add('hidden');
        btnVideo.classList.add('hidden');
        return;
      }
      
      const videoVal = q.media && q.media.video_explainer_url;
      if (videoVal !== null && videoVal !== undefined && String(videoVal).trim().toLowerCase() !== 'none' && String(videoVal).trim() !== '') {
        btnVideo.classList.remove('hidden');
      } else {
        btnVideo.classList.add('hidden');
      }
      
      let mediaHtml = '';
      if (q.media && q.media.diagram_url) {
        mediaHtml += `<div class="mb-6 border border-gray-200 bg-gray-100 rounded-lg w-full flex items-center justify-center overflow-hidden"><img src="${BASE_RAW_URL}${q.media.diagram_url}" alt="Question Diagram" onclick="toggleImageFullSize(this)" class="object-contain w-full h-auto max-h-[400px] cursor-pointer transition-all duration-300" title="Click to toggle full size" onerror="this.parentElement.innerHTML='<span class=\'text-xs text-gray-400\'>Diagram Image Reference Broken: ${q.media.diagram_url}</span>'"></div>`;
      }
      
      questionArea.innerHTML = `<div class="text-xs font-bold text-blue-600 tracking-wider uppercase mb-1">${q.metadata?.topic || 'General Science'}</div><h2 class="text-xl font-bold text-gray-900 mb-4">Question ID: ${q.id}</h2>${mediaHtml}<div id="math-text" class="text-base leading-relaxed text-gray-800 font-normal">${q.question.text}</div>`;
      renderMathInElement(document.getElementById('math-text'), { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }] });

      const structuredSteps = (q.solution && Array.isArray(q.solution.steps)) ? q.solution.steps : [];
      let totalQuestionMarks = 0;
      structuredSteps.forEach(s => {
        totalQuestionMarks += parseInt(s.marks_assigned || 1);
      });
      if (structuredSteps.length === 0) {
        totalQuestionMarks = 1;
      }

      if (totalQuestionMarks === 1) {
        workingArea.classList.add('hidden');
      } else {
        workingArea.classList.remove('hidden');
        document.getElementById('scratchpad').value = localStorage.getItem(`scratchpad-id-${q.id}`) || '';
      }

      answerArea.classList.remove('hidden');
      document.getElementById('answer-input').value = studentAnswers[currentIndex] || '';

      if (checkModeEnabled) {
        btnPrev.classList.add('hidden');
      } else {
        btnPrev.classList.remove('hidden');
        btnPrev.disabled = (currentIndex === 0);
      }

      if (currentIndex === questions.length - 1) {
        btnNext.classList.add('hidden');
        btnSubmit.classList.remove('hidden');
      } else {
        btnNext.classList.remove('hidden');
        btnSubmit.classList.add('hidden');
        if (checkModeEnabled) {
          btnNext.innerText = "Check and Continue";
        } else {
          btnNext.innerText = "Next →";
        }
      }
    }

    function openVideoModal() {
      const q = questions[currentIndex];
      if (!q || !q.media || !q.media.video_explainer_url) return;
      const rawVal = String(q.media.video_explainer_url).trim();
      
      let videoSrc = rawVal;
      if (!rawVal.startsWith('http://') && !rawVal.startsWith('https://')) {
        videoSrc = `${BASE_RAW_URL}V/${rawVal}`;
      }
      
      const videoContainer = document.getElementById('video-container');
      videoContainer.innerHTML = `<video controls autoplay class="w-full h-full object-contain"><source src="${videoSrc}" type="video/mp4">Your browser does not support the video tag.</video>`;
      document.getElementById('video-modal').classList.remove('hidden');
    }

    function closeVideoModal() {
      document.getElementById('video-modal').classList.add('hidden');
      document.getElementById('video-container').innerHTML = '';
    }

    function evaluateSingleQuestion(idx) {
      const q = questions[idx];
      if (!q || q.error) return { earned: 0, max: 1, html: "" };

      let questionEarnedMarks = 0;
      let questionMaxMarks = 0;
      const studentRawAnswer = studentAnswers[idx] || "";
      const correctRawAnswer = q.solution.final_answer;
      const targetFinalNum = parseFloat(correctRawAnswer.toString().replace(/[^0-9.-]/g, ''));
      const studentFinalNum = parseFloat(studentRawAnswer);
      const structuredSteps = (q.solution && Array.isArray(q.solution.steps)) ? q.solution.steps : [];
      
      structuredSteps.forEach(s => questionMaxMarks += parseInt(s.marks_assigned || 1));
      if (structuredSteps.length === 0) questionMaxMarks = 1;
      
      let finalAnswerCorrect = false;
      if (!isNaN(targetFinalNum) && !isNaN(studentFinalNum)) {
        if (studentFinalNum === targetFinalNum || Math.abs((studentFinalNum - targetFinalNum) / targetFinalNum) <= 0.005) {
          finalAnswerCorrect = true;
        }
      }
      
      let dynamicStepsHtml = "";
      if (finalAnswerCorrect) {
        questionEarnedMarks = questionMaxMarks;
        structuredSteps.forEach(step => {
          dynamicStepsHtml += `<div class="flex items-start gap-3 text-sm border-l-2 border-emerald-500 pl-3 py-1 bg-emerald-50/50 rounded-r"><span class="text-emerald-600 font-bold">Step ${step.step_number}:</span><div class="flex-1 text-gray-700">${step.text}</div><span class="text-xs font-semibold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full shrink-0">Earned: ${step.marks_assigned}/${step.marks_assigned}</span></div>`;
        });
      } else {
        const scratchpadText = localStorage.getItem(`scratchpad-id-${q.id}`) || "";
        const studentNumbersInWorking = (scratchpadText.match(/[+-]?\d+(\.\d+)?/g) || []).map(Number);
        structuredSteps.forEach((step) => {
          const stepWeight = parseInt(step.marks_assigned || 1);
          let milestoneMatched = false;
          if (step.check_type === "numeric" && step.milestone_value !== undefined) {
            const targetVal = parseFloat(step.milestone_value);
            const tolerancePercent = parseFloat(step.tolerance || 0.005);
            for (let num of studentNumbersInWorking) {
              if (num === targetVal || Math.abs((num - targetVal) / targetVal) <= tolerancePercent) {
                milestoneMatched = true;
                break;
              }
            }
          }
          if (milestoneMatched) {
            questionEarnedMarks += stepWeight;
            dynamicStepsHtml += `<div class="flex items-start gap-3 text-sm border-l-2 border-emerald-500 pl-3 py-1 bg-emerald-50/50 rounded-r"><span class="text-emerald-600 font-bold">Step ${step.step_number}:</span><div class="flex-1 text-gray-700">${step.text}</div><span class="text-xs font-semibold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full shrink-0">Earned: ${stepWeight}/${stepWeight}</span></div>`;
          } else {
            dynamicStepsHtml += `<div class="flex items-start gap-3 text-sm border-l-2 border-rose-300 pl-3 py-1 bg-rose-50/30 rounded-r"><span class="text-gray-400 font-bold">Step ${step.step_number}:</span><div class="flex-1 text-gray-500 line-through decoration-gray-300">${step.text}</div><span class="text-xs font-semibold px-2 py-0.5 bg-gray-100 text-gray-500 rounded-full shrink-0">Earned: 0/${stepWeight}</span></div>`;
          }
        });
      }

      const cardHtml = `<div class="bg-gray-50 border border-gray-200 rounded-xl overflow-hidden mt-4"><div class="bg-gray-100 border-b border-gray-200 px-4 py-3 flex justify-between items-center"><span class="text-xs font-bold uppercase tracking-wider text-gray-600">Feedback & Evaluation</span><span class="px-3 py-1 rounded-full font-mono font-bold text-xs ${questionEarnedMarks === questionMaxMarks ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">Marks: ${questionEarnedMarks} / ${questionMaxMarks}</span></div><div class="p-4 space-y-2"><div class="space-y-2">${dynamicStepsHtml}</div></div></div>`;
      return { earned: questionEarnedMarks, max: questionMaxMarks, html: cardHtml };
    }

    function handleNextButton() {
      if (checkModeEnabled && currentIndex < questions.length - 1) {
        const evaluation = evaluateSingleQuestion(currentIndex);
        
        showCheckFeedbackModal(evaluation.earned, evaluation.max, evaluation.html, () => {
          currentIndex++;
          renderCurrentQuestion();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      } else {
        changeQuestion(1);
      }
    }

    function showCheckFeedbackModal(earned, max, evaluationHtml, onClosedCallback) {
      const existing = document.getElementById('check-modal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto";
      modal.id = "check-modal";
      modal.innerHTML = `<div class="bg-white p-6 rounded-2xl max-w-xl w-full shadow-2xl border border-gray-100 text-left space-y-4 my-8"><div class="flex items-center gap-3"><div class="inline-flex items-center justify-center w-10 h-10 rounded-full ${earned === max ? 'bg-emerald-100 text-emerald-600' : 'bg-blue-100 text-blue-600'} shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></div><div><h3 class="font-bold text-lg text-gray-900">Question Checked</h3><p class="text-sm text-gray-600">You scored <span class="font-mono font-bold text-gray-900">${earned} / ${max}</span> marks for this question.</p></div></div><div class="mt-4 max-h-[60vh] overflow-y-auto pr-1">${evaluationHtml}</div><button id="close-check-modal-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl cursor-pointer transition-colors text-sm shadow-md mt-4">Continue to Next Question</button></div>`;
      document.body.appendChild(modal);
      
      renderMathInElement(modal, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }] });

      const closeAction = () => {
        modal.remove();
        if (onClosedCallback) onClosedCallback();
      };

      document.getElementById('close-check-modal-btn').onclick = closeAction;
      modal.onclick = (e) => { if (e.target === modal) closeAction(); };
    }

    function toggleImageFullSize(imgElement) {
      if (!imgElement.classList.contains('fixed')) {
        imgElement.dataset.originalParent = imgElement.parentElement.outerHTML;
        imgElement.classList.remove('object-contain', 'w-full', 'h-auto', 'max-h-[400px]');
        imgElement.classList.add('fixed', 'inset-0', 'm-auto', 'max-w-[95vw]', 'max-h-[95vh]', 'w-auto', 'h-auto', 'object-contain', 'z-50', 'bg-black/80', 'p-4', 'rounded-lg', 'shadow-2xl');
      } else {
        imgElement.classList.remove('fixed', 'inset-0', 'm-auto', 'max-w-[95vw]', 'max-h-[95vh]', 'w-auto', 'h-auto', 'object-contain', 'z-50', 'bg-black/80', 'p-4', 'rounded-lg', 'shadow-2xl');
        imgElement.classList.add('object-contain', 'w-full', 'h-auto', 'max-h-[400px]');
      }
    }

    function captureAnswer(val) { studentAnswers[currentIndex] = val; }
    function saveScratchpad() {
      const q = questions[currentIndex];
      if (q && q.id) localStorage.setItem(`scratchpad-id-${q.id}`, document.getElementById('scratchpad').value);
    }
    function changeQuestion(dir) { currentIndex += dir; renderCurrentQuestion(); }

    function submitQuiz() {
      const time_taken = Math.round((Date.now() - startTime) / 1000);
      let grandTotalEarned = 0;
      let grandTotalPossible = 0;
      let resultsContainerHtml = "";
      let resultsArr = [];
      
      questions.forEach((q, idx) => {
        if (q.error) return;
        const evalResult = evaluateSingleQuestion(idx);
        grandTotalEarned += evalResult.earned;
        grandTotalPossible += evalResult.max;
        resultsArr.push({ question_id: q.id, score: evalResult.earned, max_marks: evalResult.max });
        resultsContainerHtml += `<div class="bg-white rounded-xl shadow-xs border border-gray-200 overflow-hidden mb-6"><div class="bg-gray-50 border-b border-gray-200 px-6 py-4 flex justify-between items-center"><div><h3 class="text-lg font-bold text-gray-900">Q${idx + 1}: ${q.id}</h3></div><div class="px-4 py-1.5 rounded-full font-mono font-bold text-sm ${evalResult.earned === evalResult.max ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">Marks: ${evalResult.earned} / ${evalResult.max}</div></div><div class="p-6 space-y-6"><div class="text-gray-800 text-sm leading-relaxed">${q.question.text}</div><div class="pt-4 border-t border-gray-100 space-y-2"><h4 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Evaluation</h4><div class="space-y-2">${evalResult.html}</div></div></div></div>`;
      });
      
      finalResultsSummary = { userID, KEY: "29031977", time_taken, results: resultsArr };
      document.getElementById('quiz-workspace').classList.add('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      const resultsScreen = document.getElementById('quiz-results-screen');
      resultsScreen.classList.remove('hidden');
      document.getElementById('results-score-badge').innerText = `${grandTotalEarned} / ${grandTotalPossible}`;
      document.getElementById('results-cards-container').innerHTML = resultsContainerHtml;
      renderMathInElement(document.getElementById('results-cards-container'), { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }] });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      triggerPayload();
    }

    async function triggerPayload() {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50";
      modal.id = "payload-modal";
      modal.innerHTML = `<div class="bg-white p-6 rounded-2xl max-w-lg w-full overflow-auto flex flex-col shadow-2xl border border-gray-100"><h3 class="font-bold mb-2 text-gray-900 text-lg">System Submission Status</h3><div id="modal-status" class="mb-4 p-3 rounded-lg text-sm font-semibold flex items-center gap-2 bg-blue-50 text-blue-800 animate-pulse"><svg class="animate-spin h-4 w-4 text-blue-800" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span>Connecting & sending results to Flow...</span></div><button onclick="document.getElementById('payload-modal').remove()" class="mt-2 bg-gray-800 hover:bg-gray-700 text-white px-5 py-2 rounded-xl cursor-pointer transition-colors text-sm font-semibold self-end shadow-md">Close</button></div>`;
      document.body.appendChild(modal);
      
      if (POWER_AUTOMATE_URL) {
        try {
          const response = await fetch(POWER_AUTOMATE_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(finalResultsSummary) });
          const statusDiv = document.getElementById('modal-status');
          if (statusDiv) {
            statusDiv.classList.remove('animate-pulse');
            if (response.ok) {
              statusDiv.className = "mb-4 p-3 rounded-lg text-sm font-semibold flex items-center gap-2 bg-emerald-50 text-emerald-800";
              statusDiv.innerHTML = `<svg class="h-4 w-4 text-emerald-800 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg><span>Success! Results sent & processed by Power Automate.</span>`;
            } else {
              throw new Error(`Server returned status: ${response.status}`);
            }
          }
        } catch (error) {
          const statusDiv = document.getElementById('modal-status');
          if (statusDiv) {
            statusDiv.classList.remove('animate-pulse');
            statusDiv.className = "mb-4 p-3 rounded-lg text-sm font-semibold flex items-center gap-2 bg-rose-50 text-rose-800";
            statusDiv.innerHTML = `<svg class="h-4 w-4 text-rose-800 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg><span>Transfer Failed: ${error.message}</span>`;
          }
        }
      }
    }

    function pressCalc(token) {
      const display = document.getElementById('calc-display');
      if (token === 'AC') {
        calcExpression = "";
        display.innerText = "0";
      } else if (token === 'DEL') {
        calcExpression = calcExpression.slice(0, -1);
        display.innerText = calcExpression || "0";
      } else if (token === '=') {
        try {
          let result = math.evaluate(calcExpression, {
            sin: (x) => Math.sin(x * Math.PI / 180),
            cos: (x) => Math.cos(x * Math.PI / 180),
            tan: (x) => Math.tan(x * Math.PI / 180),
            sqrt: (x) => Math.sqrt(x),
            pi: Math.PI,
            Ans: lastAnswer
          });
          lastAnswer = result;
          display.innerText = result;
          calcExpression = result.toString();
        } catch {
          display.innerText = "Syntax Error";
          calcExpression = "";
        }
      } else {
        calcExpression += token;
        display.innerText = calcExpression;
      }
    }
  </script>
