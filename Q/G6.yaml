id: G6
metadata:
  topic: Capacitor Discharging
  marks: 4
  difficulty_level: 0.5
question:
  text: The graph shows the potential difference $V$ across a capacitor as it discharges
    over time $t$. Use the graph to determine the time $t$ at which the potential
    difference $V$ drops to $4.0\text{ V}$.
  variables:
  - name: V
    unit: V
  - name: t
    unit: s
solution:
  final_answer: 2.0
  marks_available: 4
  steps:
  - step_number: 1
    text: Identify the value $4.0\text{ V}$ on the y-axis, draw a horizontal line
      to the curve, and drop a vertical line to the x-axis to find the corresponding
      time.
    marks_assigned: 1
    check_type: numeric
    milestone_value: 2.0
    tolerance: 0.2
