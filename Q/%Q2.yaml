id: '%Q2'
metadata:
  topic: Energy Efficiency
  marks: 2
  difficulty_level: 0.5
question:
  text: A chloroplast absorbs $200\text{ J}$ of light energy from the Sun. Through
    the process of photosynthesis, $30\text{ J}$ of this energy is successfully converted
    into chemical energy stored in glucose. Calculate the percentage efficiency of
    this energy conversion.
  variables:
  - name: total_energy
    value: 200
  - name: useful_energy
    value: 30
solution:
  final_answer: 15.0
  marks_available: 2
  steps:
  - step_number: 1
    text: Use the formula $\text{efficiency} = \frac{\text{useful energy}}{\text{total
      energy}} \times 100$
    marks_assigned: 1
    check_type: numeric
    milestone_value: 0.15
    tolerance: 0.001
  - step_number: 2
    text: 'Calculate the percentage value: $\frac{30}{200} \times 100 = 15\%$'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 15.0
    tolerance: 0.001
