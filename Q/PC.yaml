question:
  text: A genetic research laboratory is sequencing a specific gene found in a sample
    of $5000$ DNA base pairs. It is determined that $42\%$ of these base pairs consist
    of the nitrogenous base Adenine. Calculate the total number of Adenine base pairs
    present in the sample. Show your working.
  variables:
  - name: total_base_pairs
    value: 5000
  - name: percentage
    value: 0.42
solution:
  final_answer: 2100.0
  marks_available: 4
  steps:
  - step_number: 1
    text: Identify the total number of base pairs ($5000$) and the percentage ($42\%$).
    marks_assigned: 1
    check_type: numeric
    milestone_value: 5000.0
    tolerance: 0.0
  - step_number: 2
    text: 'Convert the percentage to a decimal fraction: $\frac{42}{100} = 0.42$.'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 0.42
    tolerance: 0.0
  - step_number: 3
    text: 'Multiply the total number of base pairs by the decimal fraction: $5000
      \times 0.42$.'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 2100.0
    tolerance: 0.0
  - step_number: 4
    text: State the final answer with the correct units (base pairs).
    marks_assigned: 1
    check_type: numeric
    milestone_value: 2100.0
    tolerance: 0.0
