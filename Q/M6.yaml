id: M6
metadata:
  topic: Data Analysis
  marks: 3
  difficulty_level: 0.6
question:
  text: During a GCSE Science experiment investigating yeast cell populations, a student
    counted the number of yeast cells in five different samples. The results table
    below shows the cell counts for four samples and the calculated mean for all five
    samples. Calculate the missing yeast cell count for Sample 4. Give your answer
    to one decimal place.
  variables: []
solution:
  final_answer: 35.0
  marks_available: 3
  steps:
  - step_number: 1
    text: 'Recall the formula for the mean: $\text{Mean} = \frac{\text{Sum of all
      values}}{\text{Number of values}}$. Rearrange to find the sum of all values:
      $\text{Sum of all values} = \text{Mean} \times \text{Number of values}$.'
    marks_assigned: 1
    check_type: exact
    milestone_value: 176.0
    tolerance: 0.01
  - step_number: 2
    text: 'Calculate the sum of the four known values: $32.0 + 38.5 + 34.0 + 36.5
      = 141.0$.'
    marks_assigned: 1
    check_type: exact
    milestone_value: 141.0
    tolerance: 0.01
  - step_number: 3
    text: 'Calculate the total sum expected from the mean: $35.2 \times 5 = 176.0$.
      Subtract the sum of known values from the total sum to find the missing value:
      $176.0 - 141.0 = 35.0$. The missing value is $35.0$ cells.'
    marks_assigned: 1
    check_type: exact
    milestone_value: 35.0
    tolerance: 0.01
