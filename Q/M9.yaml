id: M9
metadata:
  topic: Reaction Times
  marks: 3
  difficulty_level: 2.8
question:
  text: "A student conducted a ruler drop test to investigate their reaction time.\
    \ They recorded five measurements for their reaction time and then calculated\
    \ the mean. The table below shows four of the measurements along with the calculated\
    \ mean reaction time. Calculate the missing reaction time for Trial 4. Give your\
    \ answer to two decimal places. "
  variables:
  - reaction time
  - mean
  - number of trials
solution:
  final_answer: 0.3
  marks_available: 3
  steps:
  - step_number: 1
    text: 'First, sum the known reaction times: $0.23 + 0.28 + 0.25 + 0.24 = 1.00
      \text{ s}$.'
    marks_assigned: 1
    check_type: exact_value
    milestone_value: 1.0
    tolerance: 0.001
  - step_number: 2
    text: 'Next, calculate the total sum of all reaction times using the given mean
      and number of trials: $\text{Total Sum} = \text{Mean} \times \text{Number of
      trials} = 0.26 \text{ s} \times 5 = 1.30 \text{ s}$.'
    marks_assigned: 1
    check_type: exact_value
    milestone_value: 1.3
    tolerance: 0.001
  - step_number: 3
    text: 'Finally, subtract the sum of known reaction times from the total sum to
      find the missing reaction time: $1.30 \text{ s} - 1.00 \text{ s} = 0.30 \text{
      s}$.'
    marks_assigned: 1
    check_type: exact_value
    milestone_value: 0.3
    tolerance: 0.001
