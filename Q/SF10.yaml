question:
  text: A student calculates the energy transferred by a heater to be $4512.3847\text{
    J}$. Round this value to $6$ significant figures.
  variables: []
solution:
  final_answer: 4512.38
  marks_available: 1
  steps:
  - step_number: 1
    text: 'Count $6$ significant figures from left to right: $4, 5, 1, 2, 3, 8$. Look
      at the $7\text{th}$ digit ($4$). Since $4 < 5$, round down to keep the $6\text{th}$
      figure as $8$, giving $4512.38$.'
