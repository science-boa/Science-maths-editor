id: G1
metadata:
  topic: Data Analysis and Health Statistics
  marks: 3
  difficulty_level: 0.5
question:
  text: The bar chart shows the incidence of a specific genetic disease per $100,000$ people across four countries. Calculate the difference in the incidence of the disease between Country B and Country D.
  variables: []
solution:
  final_answer: 28.0
  marks_available: 3
  steps:
  - step_number: 1
    text: Identify the value for Country B from the graph ($82$ cases per $100,000$).
    marks_assigned: 1
    check_type: numeric
    milestone_value: 82.0
    tolerance: 1.0
  - step_number: 2
    text: Identify the value for Country D from the graph ($54$ cases per $100,000$).
    marks_assigned: 1
    check_type: numeric
    milestone_value: 54.0
    tolerance: 1.0
  - step_number: 3
    text: 'Calculate the difference: $82 - 54 = 28$ cases per $100,000$.'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 28.0
    tolerance: 2.0
graph:
  type: bar
  data:
    x:
    - Country A
    - Country B
    - Country C
    - Country D
    y:
    - 43
    - 82
    - 67
    - 54
  pgfplots: "\begin{tikzpicture}\n\begin{axis}[                                        ymajorgrids=true,
    xmajorgrids=false,
    yminorgrids=true,
    xminorgrids=false,
    grid style={solid, black},
    minor grid style={solid, black},
    minor y tick num=1,
    minor x tick num=1
]\n\\addplot coordinates {(Country A, 43) (Country B, 82) (Country C, 67) (Country D, 54)};\n\end{axis}\n\end{tikzpicture}\n"
