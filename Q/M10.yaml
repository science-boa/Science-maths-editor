id: M10
metadata:
  topic: Chemistry
  marks: 3
  difficulty_level: 2.0
question:
  text: The table below shows the results from a titration experiment to determine
    the concentration of an unknown acid. Three accurate titrations were carried out,
    and a mean titre was calculated. Calculate the missing volume for Trial 3. Give
    your answer to two decimal places.
  variables:
  - Trial 1 volume
  - Trial 2 volume
  - Trial 4 volume
  - Mean volume
solution:
  final_answer: 25.3
  marks_available: 3
  steps:
  - step_number: 1
    text: 'The mean titre is given as $25.50 \text{ cm}^3$ and there are 4 trials.
      To find the total volume for all trials, multiply the mean by the number of
      trials: $\text{Total volume} = \text{Mean} \times \text{Number of trials} =
      25.50 \text{ cm}^3 \times 4 = 102.00 \text{ cm}^3$.'
    marks_assigned: 1
    check_type: exact
    milestone_value: 102.0
    tolerance: 0.005
  - step_number: 2
    text: 'Sum the known volumes: $25.40 \text{ cm}^3 + 25.60 \text{ cm}^3 + 25.70
      \text{ cm}^3 = 76.70 \text{ cm}^3$.'
    marks_assigned: 1
    check_type: exact
    milestone_value: 76.7
    tolerance: 0.005
  - step_number: 3
    text: 'Subtract the sum of the known volumes from the total volume to find the
      missing volume for Trial 3: $\text{Missing volume} = 102.00 \text{ cm}^3 - 76.70
      \text{ cm}^3 = 25.30 \text{ cm}^3$. Ensure the answer is to two decimal places.'
    marks_assigned: 1
    check_type: exact
    milestone_value: 25.3
    tolerance: 0.005
