id: RF4
metadata:
  topic: Chromatography
  marks: 3
  difficulty_level: 2.0
question:
  text: In a paper chromatography experiment, the $R_f$ value of a specific coloured
    spot is $0.65$. The solvent front moves a distance of $80\text{ mm}$ from the
    baseline. Use the equation $\text{R}_f = \frac{\text{distance moved by spot}}{\text{distance
    moved by solvent}}$ to calculate the distance moved by the coloured spot.
  variables:
  - Rf
  - solvent_distance
  - spot_distance
solution:
  final_answer: 52.0
  marks_available: 3
  steps:
  - step_number: 1
    text: 'Rearrange the equation to make the distance moved by the spot the subject:
      $\text{distance moved by spot} = R_f \times \text{distance moved by solvent}$.'
    marks_assigned: 1
    check_type: algebraic
    milestone_value: 0.0
    tolerance: 0.0
  - step_number: 2
    text: 'Substitute the given values into the rearranged equation: $0.65 \times
      80$.'
    marks_assigned: 1
    check_type: substitution
    milestone_value: 0.0
    tolerance: 0.0
  - step_number: 3
    text: 'Calculate the final distance: $52\text{ mm}$.'
    marks_assigned: 1
    check_type: exact
    milestone_value: 52.0
    tolerance: 0.1
