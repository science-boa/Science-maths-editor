question:
  text: In a paper chromatography experiment, a student measures the distance moved
    by a dye and the distance moved by the solvent. The dye moved a distance of $4.5\text{
    cm}$ and the solvent front moved a distance of $6.0\text{ cm}$. Calculate the
    $R_f$ value of the dye using the equation $\text{R}_f = \frac{\text{distance moved
    by substance}}{\text{distance moved by solvent}}$.
  variables:
  - distance_dye
  - distance_solvent
solution:
  final_answer: 0.75
  marks_available: 2
  steps:
