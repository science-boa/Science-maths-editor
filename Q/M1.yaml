id: M1
metadata:
  topic: Practical Skills
  marks: 2
  difficulty_level: 2.5
question:
  text: 'A student conducted an experiment to measure the growth of a plant over one
    week and recorded the following measurements in cm: $3.2$, $3.5$, $3.1$, $3.4$,
    and $3.3$. Calculate the mean growth of the plant based on these results. Show
    your working. Your answer should be given to one decimal place.'
  variables:
  - '3.2'
  - '3.5'
  - '3.1'
  - '3.4'
  - '3.3'
solution:
  final_answer: 3.3
  marks_available: 2
  steps:
  - step_number: 1
    text: 'Sum the individual measurements: $3.2 + 3.5 + 3.1 + 3.4 + 3.3 = 16.5$'
    marks_assigned: 1
    check_type: exact
    milestone_value: 16.5
    tolerance: 0.0
  - step_number: 2
    text: 'Divide the sum by the number of trials (5): $16.5 / 5 = 3.3$. Therefore,
      the mean growth is $3.3 \text{ cm}$.'
    marks_assigned: 1
    check_type: exact
    milestone_value: 3.3
    tolerance: 0.0
