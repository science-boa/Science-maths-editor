    text: 'Calculate the energy in Joules: $0.35 \times 82000 = 28700 \text{ J}$'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 28700.0
    tolerance: 0.0
  - step_number: 2
    text: 'Convert the result from Joules to $\text{kJ}$ by dividing by $1000$: $\frac{28700}{1000}$'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 28.7
    tolerance: 0.0
  - step_number: 3
    text: 'Final answer with correct units: $28.7 \text{ kJ}$'
