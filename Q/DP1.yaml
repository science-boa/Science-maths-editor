question:
  text: Round the following measured value, $12.34567$ m, to $4$ decimal places. Express
    your answer in standard form if appropriate. However, for this question, a standard
    number is sufficient.
  variables: []
solution:
  final_answer: 12.3457
  marks_available: 1
  steps:
  - step_number: 1
    text: To round $12.34567$ to $4$ decimal places, we look at the fifth decimal
      place. The digit is $7$, which is $5$ or greater, so we round up the fourth
      decimal place. Thus, $12.34567$ rounded to $4$ decimal places is $12.3457$.
    marks_assigned: 1
    check_type: exact
    milestone_value: 12.3457
    tolerance: 0.0
