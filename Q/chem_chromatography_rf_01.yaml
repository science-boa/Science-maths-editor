id: chem_chromatography_rf_01
metadata:
  topic: Chromatography
  marks: 3
  difficulty_level: 0.5
question:
  text: In a chromatography experiment, a student records that the solvent front moves
    a distance of $85\text{ mm}$ from the start line. The $R_f$ value for a specific
    coloured spot is calculated to be $0.68$. Using the equation $\text{R}_f = \frac{\text{distance
    moved by the spot}}{\text{distance moved by the solvent}}$, calculate the distance
    moved by the coloured spot.
  variables: []
solution:
  final_answer: 57.8
  marks_available: 3
  steps:
  - step_number: 1
    text: 'State the rearranged equation to find the distance moved by the spot: $\text{distance
      moved by the spot} = \text{R}_f \times \text{distance moved by the solvent}$.'
    marks_assigned: 1
    check_type: exact
    milestone_value: 0.0
    tolerance: 0.0
  - step_number: 2
    text: 'Substitute the correct values into the equation: $0.68 \times 85$.'
    marks_assigned: 1
    check_type: exact
    milestone_value: 57.8
    tolerance: 0.1
  - step_number: 3
    text: 'Calculate the final distance with the correct unit: $57.8\text{ mm}$.'
    marks_assigned: 1
    check_type: exact
    milestone_value: 57.8
    tolerance: 0.1
