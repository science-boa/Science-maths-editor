<body class="bg-gray-50 min-h-screen text-gray-800 antialiased font-sans">

    <div id="quiz-workspace" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-2 space-y-6">
        
        <div class="bg-white p-6 rounded-xl shadow-xs border border-gray-200 space-y-6">
          
          <div id="question-area">
            <div class="text-gray-400 text-center py-16">Awaiting parameters or demo preset...</div>
          </div>

          <div id="working-area" class="pt-4 border-t border-gray-100 hidden">

            <textarea id="scratchpad" oninput="saveScratchpad()" placeholder="Type your equations, formulas, and numeric calculations here..." class="w-full h-44 p-3 font-mono text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none bg-amber-50/30"></textarea>

          Total Score: <span id="results-score-badge">0 / 0</span>

  <!-- Equation Sheet Modal -->
  <div id="equation-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden">
      <div class="flex justify-between items-center p-4 border-b border-gray-100 bg-gray-50">
        <h3 class="font-bold text-lg text-gray-900">Science Equation Sheet</h3>
        <button onclick="document.getElementById('equation-modal').classList.add('hidden')" class="p-2 hover:bg-gray-200 rounded-full cursor-pointer transition-colors">
          <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <iframe src="https://www.aqa.org.uk/files/resources.science.AQA-8464-8465-FS-INS-2025_PDF/c4fac749855e8fefcd6ff58bd7b9cb701309df9b.pdf" class="flex-1 w-full border-none"></iframe>
    </div>
  </div>

  <script>
    const BASE_RAW_URL = "https://raw.githubusercontent.com/science-boa/Science-maths-editor/main/";
    const POWER_AUTOMATE_URL = "https://default4a7dcc91048348f19bae8f17879c3c.f9.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/29/workflows/a8a331e382e74657a516764c89be0275/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=KT9XgfUvTIbCqYn0cansRO7s6v85jfR9b5PieqcGt7c";

    let questions = [];
    let currentIndex = 0;
    let studentAnswers = {};
    let userID = null;
    let startTime = null;
    
    let calcExpression = "";
    let lastAnswer = 0;
    let finalResultsSummary = null;
    let activeChartInstance = null;

    window.addEventListener('DOMContentLoaded', async () => {
      startTime = Date.now();
      const params = new URLSearchParams(window.location.search);
      userID = params.get('user') || params.get('User'); 
      
      const qKeys = [];
      
      for (let i = 1; i <= 10; i++) {
        const val = params.get(`q${i}`) || params.get(`Q${i}`);
        if (val) {
          qKeys.push({ key: `q${i}`, value: val });
        }
      }

      for (const [key, val] of params.entries()) {
        const lowerKey = key.toLowerCase();
        if ((lowerKey.startsWith('g') || lowerKey.startsWith('q')) && !qKeys.some(item => item.key.toLowerCase() === lowerKey)) {
          if (val) {
            qKeys.push({ key: key, value: val });
          }
        }
      }

      // Fallback demo question if none provided in URL so preview is immediately interactive
      if (qKeys.length === 0) {
        questions.push({
          id: "demo-question",
          metadata: { topic: "Physics Mechanics Demo" },
          question: { text: "Calculate the kinetic energy of a car with mass $m = 1200\\text{ kg}$ travelling at a velocity of $v = 25\\text{ m/s}$. Use formula $E_k = \\frac{1}{2}mv^2$." },
          solution: {
            final_answer: "375000",
            steps: [
              { step_number: 1, text: "State formula $E_k = \\frac{1}{2}mv^2$", marks_assigned: 1, check_type: "numeric", milestone_value: 375000 }
            ]
          }
        });
        document.getElementById('loading-badge').classList.add('hidden');
        buildDashboard();
        renderCurrentQuestion();
        return;
      }

      for (const item of qKeys) {
        let fileId = item.value.trim();
        if (fileId.endsWith('.yaml') || fileId.endsWith('.yml')) {
          fileId = fileId.replace(/\.(yaml|yml)$/i, '');
        }

        let fetchedSuccessfully = false;
        const candidatePaths = [
          `${BASE_RAW_URL}Q/${fileId}.yaml`,
          `${BASE_RAW_URL}${fileId}.yaml`,
          `${BASE_RAW_URL}Q/g1/${fileId}.yaml`
        ];

        for (const url of candidatePaths) {
          try {
            const response = await fetch(url);
            if (response.ok) {
              const text = await response.text();
              const parsed = jsyaml.load(text);
              questions.push({ ...parsed, id: fileId });
              fetchedSuccessfully = true;
              break;
            }
          } catch (e) {
            // Try next candidate
          }
        }

        if (!fetchedSuccessfully) {
          questions.push({ id: fileId, error: true, message: `Failed fetching YAML configuration for identifier: ${fileId}` });
        }
      }

      document.getElementById('loading-badge').classList.add('hidden');
      buildDashboard();
      renderCurrentQuestion();
    });

    function buildDashboard() {
      const container = document.getElementById('dashboard');
      container.innerHTML = '';
      questions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.innerText = `Q${idx + 1}`;
        btn.className = `px-4 py-2 text-sm font-semibold rounded-lg border transition-all cursor-pointer ${idx === currentIndex ? 'bg-blue-600 border-blue-600 text-white shadow-xs' : 'bg-white border-gray-200 hover:bg-gray-50 text-gray-700'}`;
        btn.onclick = () => { currentIndex = idx; renderCurrentQuestion(); };
        container.appendChild(btn);
      });
    }

    function renderCurrentQuestion() {
      buildDashboard();
      const questionArea = document.getElementById('question-area');
      const workingArea = document.getElementById('working-area');
      const answerArea = document.getElementById('answer-area');
      const q = questions[currentIndex];
      if (!q) return;
      if (q.error) {
        questionArea.innerHTML = `<div class="text-red-500 font-medium">⚠️ ${q.message} (${q.id})</div>`;
        workingArea.classList.add('hidden');
        answerArea.classList.add('hidden');
        return;
      }
      
      let mediaHtml = '';
      if (q.media && q.media.diagram_url) {
        mediaHtml += `<div class="mb-6 border border-gray-200 bg-gray-100 rounded-lg w-full max-h-[500px] flex items-center justify-center overflow-hidden"><img src="${BASE_RAW_URL}${q.media.diagram_url}" alt="Question Diagram" class="object-contain w-full h-auto max-h-[400px]" onerror="this.parentElement.innerHTML='<span class=\'text-xs text-gray-400\'>Diagram Image Reference Broken: ${q.media.diagram_url}</span>'"></div>`;
      }
      
      mediaHtml += `<div id="graph-container-${currentIndex}" class="mb-6 border border-gray-200 bg-white p-4 rounded-lg w-full ${q.graph ? '' : 'hidden'}"><div class="relative w-full h-72 md:h-96 max-h-[500px]"><canvas id="pgfplot-canvas-${currentIndex}"></canvas></div></div>`;
      
      questionArea.innerHTML = `<div class="text-xs font-bold text-blue-600 tracking-wider uppercase mb-1">${q.metadata?.topic || 'General Science'}</div><h2 class="text-xl font-bold text-gray-900 mb-4">Question ID: ${q.id}</h2>${mediaHtml}<div id="math-text" class="text-base leading-relaxed text-gray-800 font-normal">${q.question.text}</div>`;
      renderMathInElement(document.getElementById('math-text'), { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }] });
      
      if (q.graph) {
        setTimeout(() => {
          renderPGFPlot(q.graph, `pgfplot-canvas-${currentIndex}`);
        }, 50);
      }

      workingArea.classList.remove('hidden');
      document.getElementById('scratchpad').value = localStorage.getItem(`scratchpad-id-${q.id}`) || '';
      answerArea.classList.remove('hidden');
      document.getElementById('answer-input').value = studentAnswers[currentIndex] || '';
      document.getElementById('btn-prev').disabled = (currentIndex === 0);
      if (currentIndex === questions.length - 1) {
        document.getElementById('btn-next').classList.add('hidden');
        document.getElementById('btn-submit').classList.remove('hidden');
      } else {
        document.getElementById('btn-next').classList.remove('hidden');
        document.getElementById('btn-submit').classList.add('hidden');
      }
    }

    function parsePgfplotsOptions(str) {
      const options = {};
      if (!str || typeof str !== 'string') return options;

      let axisOptStr = str;
      const axisMatch = str.match(/\\begin\{axis\}\s*\[([\s\S]*?)\]/);
      if (axisMatch) {
        axisOptStr = axisMatch[1];
      }

      let currentKey = '';
      let currentValue = '';
      let inBraces = 0;
      let isParsingValue = false;

      for (let i = 0; i < axisOptStr.length; i++) {
        const char = axisOptStr[i];

        if (char === '{') {
          inBraces++;
          if (isParsingValue && inBraces > 1) currentValue += char;
        } else if (char === '}') {
          inBraces--;
          if (isParsingValue && inBraces > 0) currentValue += char;
        } else if (char === '=' && inBraces === 0 && !isParsingValue) {
          isParsingValue = true;
        } else if ((char === ',' || char === '\n') && inBraces === 0) {
          if (currentKey.trim()) {
            const k = currentKey.trim();
            const v = isParsingValue ? currentValue.trim() : true;
            options[k] = v;
          }
          currentKey = '';
          currentValue = '';
          isParsingValue = false;
        } else {
          if (isParsingValue) {
            currentValue += char;
          } else {
            currentKey += char;
          }
        }
      }
      if (currentKey.trim()) {
        const k = currentKey.trim();
        const v = isParsingValue ? currentValue.trim() : true;
        options[k] = v;
      }

      return options;
    }

    function parseLatexColor(str, defaultColor = 'rgba(156, 163, 175, 0.5)') {
      if (!str) return defaultColor;
      str = str.trim();

      const colorMap = {
        'gray': [128, 128, 128],
        'black': [0, 0, 0],
        'white': [255, 255, 255],
        'red': [239, 68, 68],
        'blue': [59, 130, 246],
        'green': [34, 197, 94],
        'yellow': [234, 179, 8],
        'cyan': [6, 182, 212],
        'magenta': [217, 70, 239],
        'orange': [249, 115, 22],
        'purple': [168, 85, 247],
        'violet': [139, 92, 246],
        'teal': [20, 184, 166],
        'brown': [180, 83, 9]
      };

      const mixMatch = str.match(/^([a-zA-Z]+)!(\d+)(?:!([a-zA-Z]+))?$/);
      if (mixMatch) {
        const baseColorName = mixMatch[1].toLowerCase();
        const percent = parseFloat(mixMatch[2]) / 100;
        const mixColorName = (mixMatch[3] || 'white').toLowerCase();

        const c1 = colorMap[baseColorName] || [128, 128, 128];
        const c2 = colorMap[mixColorName] || [255, 255, 255];

        const r = Math.round(c1[0] * percent + c2[0] * (1 - percent));
        const g = Math.round(c1[1] * percent + c2[1] * (1 - percent));
        const b = Math.round(c1[2] * percent + c2[2] * (1 - percent));

        return `rgb(${r}, ${g}, ${b})`;
      }

      if (colorMap[str.toLowerCase()]) {
        const c = colorMap[str.toLowerCase()];
        return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
      }

      if (str.startsWith('#') || str.startsWith('rgb') || str.startsWith('hsl')) {
        return str;
      }

      return defaultColor;
    }

    function parseStyleProps(styleStr) {
      const result = {
        color: null,
        borderDash: [],
        borderWidth: 1
      };
      if (!styleStr) return result;

      const parts = styleStr.split(',').map(p => p.trim());
      parts.forEach(part => {
        if (part === 'solid') {
          result.borderDash = [];
        } else if (part === 'dashed') {
          result.borderDash = [6, 6];
        } else if (part === 'dotted') {
          result.borderDash = [2, 2];
        } else if (part === 'dense dotted') {
          result.borderDash = [1, 2];
        } else if (part === 'loose dotted') {
          result.borderDash = [3, 5];
        } else if (part === 'ultra thin') {
          result.borderWidth = 0.5;
        } else if (part === 'very thin') {
          result.borderWidth = 0.75;
        } else if (part === 'thin') {
          result.borderWidth = 1;
        } else if (part === 'thick') {
          result.borderWidth = 2;
        } else if (part === 'very thick') {
          result.borderWidth = 3;
        } else if (part.includes('!')) {
          result.color = parseLatexColor(part);
        } else {
          const parsedCol = parseLatexColor(part, null);
          if (parsedCol) result.color = parsedCol;
        }
      });

      return result;
    }

    function cleanTexString(str) {
      if (!str) return '';
      return str.replace(/\$/g, '').trim();
    }

    function renderPGFPlot(graphConfig, canvasId) {
      if (activeChartInstance) {
        activeChartInstance.destroy();
        activeChartInstance = null;
      }
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;

      try {
        let opts = {};
        let pgfString = "";

        if (typeof graphConfig === 'string') {
          pgfString = graphConfig;
          opts = parsePgfplotsOptions(graphConfig);
        } else if (typeof graphConfig === 'object' && graphConfig !== null) {
          Object.assign(opts, graphConfig);
          if (typeof graphConfig.pgfplots === 'string') {
            pgfString = graphConfig.pgfplots;
            const parsedPgf = parsePgfplotsOptions(graphConfig.pgfplots);
            opts = { ...opts, ...parsedPgf };
          }
        }

        let chartType = 'line';
        if (opts.type === 'bar' || opts.ybar || (pgfString && pgfString.includes('ybar'))) {
          chartType = 'bar';
        }

        let datasetLabel = cleanTexString(opts.ylabel || opts.label) || 'Value';
        let xLabelText = cleanTexString(opts.xlabel);
        let chartTitle = cleanTexString(opts.title);

        let labels = [];
        let dataPoints = [];

        if (graphConfig && typeof graphConfig === 'object' && graphConfig.data && Array.isArray(graphConfig.data.x) && Array.isArray(graphConfig.data.y)) {
          labels = graphConfig.data.x;
          dataPoints = graphConfig.data.y;
        } else if (graphConfig && typeof graphConfig === 'object' && Array.isArray(graphConfig.coordinates)) {
          labels = graphConfig.coordinates.map(pt => pt[0]);
          dataPoints = graphConfig.coordinates.map(pt => pt[1]);
        } else if (pgfString) {
          const addplotMatch = pgfString.match(/\\addplot\s*(?:\[([\s\S]*?)\])?\s*(?:coordinates\s*)?\{([\s\S]*?)\}/);
          if (addplotMatch) {
            const coordBlock = addplotMatch[2];
            const matches = coordBlock.matchAll(/\(\s*([^,]+)\s*,\s*([+-]?\d*\.?\d+)\s*\)/g);
            for (const match of matches) {
              const xVal = match[1].trim();
              const yVal = parseFloat(match[2]);
              if (chartType === 'bar' || isNaN(parseFloat(xVal))) {
                labels.push(xVal);
                dataPoints.push(yVal);
              } else {
                dataPoints.push({ x: parseFloat(xVal), y: yVal });
              }
            }
          }
        }

        if (labels.length === 0 && opts['symbolic x coords']) {
          const symStr = opts['symbolic x coords'].replace(/^\{|\}$/g, '');
          labels = symStr.split(',').map(s => s.trim());
        }

        // Parsing Grid & Formatting Instructions
        const ymajorgrids = (opts.ymajorgrids === 'true' || opts.ymajorgrids === true || (opts.ymajorgrids !== 'false' && opts.ymajorgrids !== false));
        const xmajorgrids = (opts.xmajorgrids === 'true' || opts.xmajorgrids === true);
        const yminorgrids = (opts.yminorgrids === 'true' || opts.yminorgrids === true);
        const xminorgrids = (opts.xminorgrids === 'true' || opts.xminorgrids === true);

        const minorYTickNum = parseInt(opts['minor y tick num'] || opts.minor_y_tick_num || opts.minorYTickNum || 0);
        const minorXTickNum = parseInt(opts['minor x tick num'] || opts.minor_x_tick_num || opts.minorXTickNum || 0);

        const majorGridStyle = parseStyleProps(opts['grid style'] || opts.grid_style || opts.gridStyle);
        const minorGridStyle = parseStyleProps(opts['minor grid style'] || opts.minor_grid_style || opts.minorGridStyle);

        const numericY = dataPoints.map(p => (typeof p === 'object' && p !== null ? p.y : parseFloat(p))).filter(v => !isNaN(v));
        const rawMinY = numericY.length ? Math.min(...numericY) : 0;
        const rawMaxY = numericY.length ? Math.max(...numericY) : 100;

        let yScaleMin = opts.ymin !== undefined ? parseFloat(opts.ymin) : Math.min(0, rawMinY);
        let yScaleMax = opts.ymax !== undefined ? parseFloat(opts.ymax) : undefined;

        if (yScaleMax === undefined) {
          yScaleMax = Math.ceil(rawMaxY / 20) * 20;
          if (yScaleMax <= rawMaxY) yScaleMax = Math.ceil((rawMaxY + 10) / 10) * 10;
        }

        const yRange = yScaleMax - yScaleMin;
        const majorStep = yRange > 0 ? (yRange / 5) : 20;
        const subStep = (minorYTickNum > 0 && yRange > 0) ? (majorStep / (minorYTickNum + 1)) : majorStep;

        const checkIsMajor = (val, baseMin, step) => {
          const rel = Math.abs(val - baseMin);
          const rem = rel % step;
          return rem < 1e-4 || Math.abs(rem - step) < 1e-4;
        };

        const chartConfig = {
          type: chartType === 'bar' ? 'bar' : 'line',
          data: {
            labels: labels.length > 0 ? labels : undefined,
            datasets: [{
              label: datasetLabel,
              data: dataPoints,
              backgroundColor: chartType === 'bar' ? '#000000' : 'rgba(37, 99, 235, 0.6)',
              borderColor: chartType === 'bar' ? '#000000' : '#2563eb',
              borderWidth: 1,
              tension: 0.1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              title: {
                display: !!chartTitle,
                text: chartTitle,
                font: { size: 14, weight: 'bold' }
              }
            },
            scales: {
              x: {
                title: {
                  display: !!xLabelText,
                  text: xLabelText,
                  font: { size: 12, weight: 'bold' }
                },
                grid: {
                  display: xmajorgrids || xminorgrids,
                  color: (ctx) => {
                    if (!xmajorgrids && !xminorgrids) return 'transparent';
                    return majorGridStyle.color || '#e5e7eb';
                  },
                  borderDash: majorGridStyle.borderDash || [],
                  lineWidth: majorGridStyle.borderWidth || 1
                }
              },
              y: {
                min: yScaleMin,
                max: yScaleMax,
                title: {
                  display: !!datasetLabel,
                  text: datasetLabel,
                  font: { size: 12, weight: 'bold' }
                },
                ticks: {
                  stepSize: subStep,
                  callback: function(value) {
                    return checkIsMajor(value, yScaleMin, majorStep) ? value : '';
                  }
                },
                grid: {
                  display: ymajorgrids || yminorgrids,
                  color: function(context) {
                    if (!context.tick) return majorGridStyle.color || '#e5e7eb';
                    const val = context.tick.value;
                    const isMajor = checkIsMajor(val, yScaleMin, majorStep);
                    if (isMajor) {
                      return ymajorgrids ? (majorGridStyle.color || '#d1d5db') : 'transparent';
                    } else {
                      return yminorgrids ? (minorGridStyle.color || 'rgba(156, 163, 175, 0.4)') : 'transparent';
                    }
                  },
                  borderDash: function(context) {
                    if (!context.tick) return [];
                    const val = context.tick.value;
                    const isMajor = checkIsMajor(val, yScaleMin, majorStep);
                    if (isMajor) {
                      return majorGridStyle.borderDash || [];
                    } else {
                      return minorGridStyle.borderDash || [];
                    }
                  },
                  lineWidth: function(context) {
                    if (!context.tick) return 1;
                    const val = context.tick.value;
                    const isMajor = checkIsMajor(val, yScaleMin, majorStep);
                    if (isMajor) {
                      return majorGridStyle.borderWidth || 1;
                    } else {
                      return minorGridStyle.borderWidth || 0.75;
                    }
                  }
                }
              }
            }
          }
        };

        activeChartInstance = new Chart(ctx, chartConfig);
      } catch (e) {
        console.error("Failed parsing PGFPlot/graph config:", e);
      }
    }

    function captureAnswer(val) { studentAnswers[currentIndex] = val; }
    function saveScratchpad() {
      const q = questions[currentIndex];
      if (q && q.id) localStorage.setItem(`scratchpad-id-${q.id}`, document.getElementById('scratchpad').value);
    }
    function changeQuestion(dir) { currentIndex += dir; renderCurrentQuestion(); }

    function submitQuiz() {
      const time_taken = Math.round((Date.now() - startTime) / 1000);
      let grandTotalEarned = 0;
      let grandTotalPossible = 0;
      let resultsContainerHtml = "";
      let resultsArr = [];
      
      questions.forEach((q, idx) => {
        if (q.error) return;
        let questionEarnedMarks = 0;
        let questionMaxMarks = 0;
        const studentRawAnswer = studentAnswers[idx] || "";
        const correctRawAnswer = q.solution.final_answer;
        const targetFinalNum = parseFloat(correctRawAnswer.toString().replace(/[^0-9.-]/g, ''));
        const studentFinalNum = parseFloat(studentRawAnswer);
        const structuredSteps = (q.solution && Array.isArray(q.solution.steps)) ? q.solution.steps : [];
        
        structuredSteps.forEach(s => questionMaxMarks += parseInt(s.marks_assigned || 1));
        if (structuredSteps.length === 0) questionMaxMarks = 1;
        
        let finalAnswerCorrect = false;
        if (!isNaN(targetFinalNum) && !isNaN(studentFinalNum)) {
          if (studentFinalNum === targetFinalNum || Math.abs((studentFinalNum - targetFinalNum) / targetFinalNum) <= 0.005) {
            finalAnswerCorrect = true;
          }
        }
        
        let dynamicStepsHtml = "";
        if (finalAnswerCorrect) {
          questionEarnedMarks = questionMaxMarks;
          structuredSteps.forEach(step => {
            dynamicStepsHtml += `<div class="flex items-start gap-3 text-sm border-l-2 border-emerald-500 pl-3 py-1 bg-emerald-50/50 rounded-r"><span class="text-emerald-600 font-bold">Step ${step.step_number}:</span><div class="flex-1 text-gray-700">${step.text}</div><span class="text-xs font-semibold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full shrink-0">Earned: ${step.marks_assigned}/${step.marks_assigned}</span></div>`;
          });
        } else {
          const scratchpadText = localStorage.getItem(`scratchpad-id-${q.id}`) || "";
          const studentNumbersInWorking = (scratchpadText.match(/[+-]?\d+(\.\d+)?/g) || []).map(Number);
          structuredSteps.forEach((step) => {
            const stepWeight = parseInt(step.marks_assigned || 1);
            let milestoneMatched = false;
            if (step.check_type === "numeric" && step.milestone_value !== undefined) {
              const targetVal = parseFloat(step.milestone_value);
              const tolerancePercent = parseFloat(step.tolerance || 0.005);
              for (let num of studentNumbersInWorking) {
                if (num === targetVal || Math.abs((num - targetVal) / targetVal) <= tolerancePercent) {
                  milestoneMatched = true;
                  break;
                }
              }
            }
            if (milestoneMatched) {
              questionEarnedMarks += stepWeight;
              dynamicStepsHtml += `<div class="flex items-start gap-3 text-sm border-l-2 border-emerald-500 pl-3 py-1 bg-emerald-50/50 rounded-r"><span class="text-emerald-600 font-bold">Step ${step.step_number}:</span><div class="flex-1 text-gray-700">${step.text}</div><span class="text-xs font-semibold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full shrink-0">Earned: ${stepWeight}/${stepWeight}</span></div>`;
            } else {
              dynamicStepsHtml += `<div class="flex items-start gap-3 text-sm border-l-2 border-rose-300 pl-3 py-1 bg-rose-50/30 rounded-r"><span class="text-gray-400 font-bold">Step ${step.step_number}:</span><div class="flex-1 text-gray-500 line-through decoration-gray-300">${step.text}</div><span class="text-xs font-semibold px-2 py-0.5 bg-gray-100 text-gray-500 rounded-full shrink-0">Earned: 0/${stepWeight}</span></div>`;
            }
          });
        }
        
        grandTotalEarned += questionEarnedMarks;
        grandTotalPossible += questionMaxMarks;
        resultsArr.push({ question_id: q.id, score: questionEarnedMarks, max_marks: questionMaxMarks });
        resultsContainerHtml += `<div class="bg-white rounded-xl shadow-xs border border-gray-200 overflow-hidden mb-6"><div class="bg-gray-50 border-b border-gray-200 px-6 py-4 flex justify-between items-center"><div><h3 class="text-lg font-bold text-gray-900">Q${idx + 1}: ${q.id}</h3></div><div class="px-4 py-1.5 rounded-full font-mono font-bold text-sm ${questionEarnedMarks === questionMaxMarks ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">Marks: ${questionEarnedMarks} / ${questionMaxMarks}</div></div><div class="p-6 space-y-6"><div class="text-gray-800 text-sm leading-relaxed">${q.question.text}</div><div class="pt-4 border-t border-gray-100 space-y-2"><h4 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Evaluation</h4><div class="space-y-2">${dynamicStepsHtml}</div></div></div></div>`;
      });
      
      finalResultsSummary = { userID, KEY: "29031977", time_taken, results: resultsArr };
      document.getElementById('quiz-workspace').classList.add('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      const resultsScreen = document.getElementById('quiz-results-screen');
      resultsScreen.classList.remove('hidden');
      document.getElementById('results-score-badge').innerText = `${grandTotalEarned} / ${grandTotalPossible}`;
      document.getElementById('results-cards-container').innerHTML = resultsContainerHtml;
      renderMathInElement(document.getElementById('results-cards-container'), { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }] });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      triggerPayload();
    }

    async function triggerPayload() {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50";
      modal.id = "payload-modal";
      modal.innerHTML = `<div class="bg-white p-6 rounded-2xl max-w-lg w-full max-h-[80vh] overflow-auto flex flex-col shadow-2xl border border-gray-100"><h3 class="font-bold mb-2 text-gray-900 text-lg">System Submission Status</h3><div id="modal-status" class="mb-4 p-3 rounded-lg text-sm font-semibold flex items-center gap-2 bg-blue-50 text-blue-800 animate-pulse"><svg class="animate-spin h-4 w-4 text-blue-800" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span>Connecting & sending results to Flow...</span></div><h4 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Payload Output Data</h4><pre class="bg-gray-100 p-4 rounded-lg text-xs text-gray-800 font-mono overflow-auto max-h-56">${JSON.stringify(finalResultsSummary, null, 2)}</pre><button onclick="document.getElementById('payload-modal').remove()" class="mt-5 bg-gray-800 hover:bg-gray-700 text-white px-5 py-2 rounded-xl cursor-pointer transition-colors text-sm font-semibold self-end shadow-md">Close Preview</button></div>`;
      document.body.appendChild(modal);
      
      if (POWER_AUTOMATE_URL) {
        try {
          const response = await fetch(POWER_AUTOMATE_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(finalResultsSummary) });
          const statusDiv = document.getElementById('modal-status');
          if (statusDiv) {
            statusDiv.classList.remove('animate-pulse');
            if (response.ok) {
              statusDiv.className = "mb-4 p-3 rounded-lg text-sm font-semibold flex items-center gap-2 bg-emerald-50 text-emerald-800";
              statusDiv.innerHTML = `<svg class="h-4 w-4 text-emerald-800 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg><span>Success! Results sent & processed by Power Automate.</span>`;
            } else {
              throw new Error(`Server returned status: ${response.status}`);
            }
          }
        } catch (error) {
          const statusDiv = document.getElementById('modal-status');
          if (statusDiv) {
            statusDiv.classList.remove('animate-pulse');
            statusDiv.className = "mb-4 p-3 rounded-lg text-sm font-semibold flex items-center gap-2 bg-rose-50 text-rose-800";
            statusDiv.innerHTML = `<svg class="h-4 w-4 text-rose-800 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg><span>Transfer Failed: ${error.message}</span>`;
          }
        }
      }
    }

    function pressCalc(token) {
      const display = document.getElementById('calc-display');
      if (token === 'AC') {
        calcExpression = "";
        display.innerText = "0";
      } else if (token === 'DEL') {
        calcExpression = calcExpression.slice(0, -1);
        display.innerText = calcExpression || "0";
      } else if (token === '=') {
        try {
          let result = math.evaluate(calcExpression, {
            sin: (x) => Math.sin(x * Math.PI / 180),
            cos: (x) => Math.cos(x * Math.PI / 180),
            tan: (x) => Math.tan(x * Math.PI / 180),
            sqrt: (x) => Math.sqrt(x),
            pi: Math.PI,
            Ans: lastAnswer
          });
          lastAnswer = result;
          display.innerText = result;
          calcExpression = result.toString();
        } catch {
          display.innerText = "Syntax Error";
          calcExpression = "";
        }
      } else {
        calcExpression += token;
        display.innerText = calcExpression;
      }
    }
  </script>
