type: line
title: Cooling curve of a liquid over time
xlabel: Time ($s$)
ylabel: Temperature ($^\circ C$)
axes:
  xmin: 0
  xmax: 100
  xtick_distance: 10
  ymin: 0
  ymax: 100
  ytick_distance: 10
  grid: true
  x_major_grid:
    present: true
    color: '#000000'
    opacity: 1.0
    style: solid
  y_major_grid:
    present: true
    color: '#000000'
    opacity: 1.0
    style: solid
  x_minor_grid:
    present: true
    color: '#000000'
    opacity: 1.0
    style: dashed
    divisions: 5
  y_minor_grid:
    present: true
    color: '#000000'
    opacity: 1.0
    style: dashed
    divisions: 5
datasets:
- label: Cooling Curve
  values:
  - - 0
    - 100
  - - 10
    - 75
  - - 20
    - 55
  - - 30
    - 40
  - - 40
    - 30
  - - 60
    - 20
  - - 80
    - 15
  - - 100
    - 12
  point_size: 5
