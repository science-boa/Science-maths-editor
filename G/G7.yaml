type: line
title: Activity of a Radioactive Isotope
xlabel: Time (s)
ylabel: Activity (Bq)
axes:
  ymin: 0
  ymax: 1000
  ytick_distance: 100
  grid: true
  x_major_grid:
    present: true
    color: '#000000'
    opacity: 1.0
    style: solid
  x_minor_grid:
    present: false
    count: 2
    color: '#000000'
    opacity: 0.5
    style: solid
  y_major_grid:
    present: true
    color: '#000000'
    opacity: 1.0
    style: solid
  y_minor_grid:
    present: false
    count: 5
    color: '#000000'
    opacity: 0.5
    style: solid
datasets:
