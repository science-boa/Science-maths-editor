question:
  text: The graph shows the temperature $T$ in $^\circ\text{C}$ of a cooling liquid
    over time $t$ in minutes. Using the graph, determine the time at which the temperature
    of the liquid reaches $40^\circ\text{C}$.
  variables:
  - $T$
  - $t$
