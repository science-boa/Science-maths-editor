question:
  text: In a paper chromatography experiment, a coloured dye moves a distance of $4.5\text{
    cm}$ from the start line. The solvent front moves a total distance of $9.0\text{
    cm}$ from the start line. Use the equation $R_f = \frac{\text{distance moved by
    spot}}{\text{distance moved by solvent}}$ to calculate the $R_f$ value of the
    coloured dye.
  variables: []
solution:
  final_answer: 0.5
  marks_available: 2
  steps:
  - step_number: 1
    text: 'Substitute the correct values into the $R_f$ equation: $R_f = \frac{4.5}{9.0}$'
    marks_assigned: 1
    check_type: exact
    milestone_value: 0.5
    tolerance: 0.01
  - step_number: 2
    text: 'Calculate the final $R_f$ value with no units: $0.5$'
    marks_assigned: 1
