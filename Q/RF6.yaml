id: RF6
metadata:
  topic: Chemistry - Chromatography
  marks: 3
  difficulty_level: 2.0
question:
  text: In a chromatography experiment, the $R_f$ value of a coloured spot is $0.75$
    and the distance moved by the solvent from the start line is $80\,\text{mm}$.
    Using the equation $\text{R}_f = \frac{\text{distance moved by spot}}{\text{distance
    moved by solvent}}$, calculate the distance moved by the coloured spot.
  variables:
  - Rf
  - solvent_distance
  - spot_distance
solution:
  final_answer: 60.0
  marks_available: 3
  steps:
  - step_number: 1
    text: 'Recall or identify the correct rearranged equation to find the distance
      moved by the spot: $\text{distance moved by spot} = R_f \times \text{distance
      moved by solvent}$'
    marks_assigned: 1
    check_type: exact
    milestone_value: 0.0
    tolerance: 0.0
  - step_number: 2
    text: 'Substitute the given values into the equation: $\text{distance moved by
      spot} = 0.75 \times 80$'
    marks_assigned: 1
    check_type: exact
    milestone_value: 0.0
    tolerance: 0.0
  - step_number: 3
    text: 'Calculate the final distance with correct units: $60\,\text{mm}$'
    marks_assigned: 1
    check_type: range
    milestone_value: 60.0
    tolerance: 0.1
