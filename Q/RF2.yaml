question:
  text: 'In a paper chromatography experiment, a coloured dot moves a distance of
    $24\text{ mm}$ from the start line. The solvent front moves a distance of $90\text{
    mm}$ from the start line. Calculate the $R_f$ value for the coloured dot using
    the equation: $R_f = \frac{\text{distance moved by substance}}{\text{distance
    moved by solvent}}$. Give your answer to 2 decimal places.'
  variables:
  - '24'
  - '90'
solution:
  final_answer: 0.27
  marks_available: 2
  steps:
  - step_number: 1
    text: 'Substitute the correct values into the $R_f$ equation: $R_f = \frac{24}{90}$'
    marks_assigned: 1
    check_type: exact
    milestone_value: 0.26
    tolerance: 0.01
  - step_number: 2
    text: 'Calculate the final $R_f$ value to 2 decimal places: $0.27$'
