question:
  text: The measured period of oscillation of a simple pendulum is found to be $1.23856
    \text{ s}$. Round this value to two decimal places.
  variables: []
solution:
  final_answer: 1.24
  marks_available: 1
  steps:
  - step_number: 1
    text: To round to two decimal places, identify the digit in the third decimal
      place. If this digit is 5 or greater, round up the second decimal place digit.
      The value is $1.23856 \text{ s}$. The second decimal place is '3' and the third
      decimal place is '8'. Since '8' is greater than or equal to 5, we round up the
      '3' to '4'.
    marks_assigned: 1
    check_type: exact_value
    milestone_value: 1.24
    tolerance: 0.0
