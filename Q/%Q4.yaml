question:
  text: A wheat plant absorbs $4.50 \times 10^3 \text{ J}$ of energy from sunlight.
    Only $12\%$ of this energy is transferred to the chemical store of the plant through
    photosynthesis. Calculate the energy transferred to the chemical store in $\text{kJ}$.
  variables:
  - total_energy: 4500
  - efficiency: 0.12
solution:
  final_answer: 0.54
  marks_available: 4
  steps:
  - step_number: 1
    text: 'Identify the percentage calculation: $\frac{12}{100} \times 4500$'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 540.0
    tolerance: 0.0
  - step_number: 2
    text: 'State the energy in Joules: $540 \text{ J}$'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 540.0
    tolerance: 0.0
  - step_number: 3
    text: 'Convert the result to $\text{kJ}$ by dividing by $1000$: $\frac{540}{1000}$'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 0.54
    tolerance: 0.001
  - step_number: 4
    text: 'Final answer with correct units: $0.54 \text{ kJ}$'
    marks_assigned: 1
    check_type: numeric
    milestone_value: 0.54
    tolerance: 0.001
